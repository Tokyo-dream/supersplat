<!DOCTYPE html>
<html>
    <head>
        <title>SuperSplat Lite</title>
        <meta charset="utf-8" />
        <link rel="stylesheet" href="./lite.css">
        <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0" />
        <style>
            * { margin: 0; padding: 0; box-sizing: border-box; }
            body {
                background-color: #000;
                overflow: hidden;
                touch-action: none;
                font-family: 'Helvetica Neue', Arial, sans-serif;
                font-size: 12px;
                user-select: none;
            }
            #canvas-container {
                width: 100vw;
                height: 100vh;
                position: relative;
            }
            #canvas {
                width: 100%;
                height: 100%;
                image-rendering: pixelated;
            }
            #tools-container {
                display: none;
                position: absolute;
                width: 100%;
                height: 100%;
                cursor: crosshair;
            }
            #tools-container.noevents {
                pointer-events: none;
            }
            #mask-canvas {
                display: none;
                position: absolute;
                opacity: 0.4;
            }
            #app-label {
                position: absolute;
                right: 20px;
                bottom: 20px;
                color: rgba(255, 255, 255, 0.7);
                text-shadow: 1px 1px 4px black;
                pointer-events: none;
            }
            #cursor-label {
                position: absolute;
                left: 12px;
                bottom: 12px;
                color: rgba(255, 255, 255, 0.7);
                text-shadow: 1px 1px 4px black;
                padding: 8px;
                border-radius: 4px;
                border: 1px solid transparent;
                cursor: pointer;
            }
            #cursor-label:hover {
                border: 1px solid #f60;
                background-color: rgba(0, 0, 0, 0.25);
            }
            .select-toolbar {
                position: absolute;
                bottom: 40px;
                left: 50%;
                transform: translateX(-50%);
                display: flex;
                align-items: center;
                gap: 8px;
                background: rgba(30, 30, 30, 0.9);
                padding: 6px 12px;
                border-radius: 6px;
                border: 1px solid #555;
                color: #ccc;
            }
            .select-toolbar input {
                width: 80px;
                background: #222;
                color: #fff;
                border: 1px solid #555;
                padding: 4px 6px;
                border-radius: 3px;
                font-size: 12px;
            }
            #measure-tool-svg {
                position: absolute;
                width: 100%;
                height: 100%;
                pointer-events: none;
            }
            #measure-tool-svg.hidden {
                display: none;
            }
            #measure-line { stroke: #ff6600; stroke-width: 2; }
            #measure-line-start, #measure-line-end { fill: #ff6600; r: 5; }
            #drop-overlay {
                display: none;
                position: absolute;
                inset: 0;
                background: rgba(255, 102, 0, 0.15);
                border: 3px dashed #f60;
                z-index: 100;
                pointer-events: none;
            }
            #drop-overlay.active { display: block; }
            #open-file-btn {
                position: absolute;
                top: 12px;
                left: 12px;
                background: rgba(30, 30, 30, 0.85);
                color: #ccc;
                border: 1px solid #555;
                padding: 8px 16px;
                border-radius: 4px;
                cursor: pointer;
                font-size: 13px;
                z-index: 10;
            }
            #open-file-btn:hover {
                border-color: #f60;
                color: #fff;
            }
            #measure-btn {
                position: absolute;
                top: 12px;
                left: 130px;
                background: rgba(30, 30, 30, 0.85);
                color: #ccc;
                border: 1px solid #555;
                padding: 8px 16px;
                border-radius: 4px;
                cursor: pointer;
                font-size: 13px;
                z-index: 10;
            }
            #measure-btn:hover { border-color: #f60; color: #fff; }
            #measure-btn.active { background: #f60; color: #fff; border-color: #f60; }
            #spinner {
                display: none;
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                width: 40px;
                height: 40px;
                border: 3px solid rgba(255, 255, 255, 0.2);
                border-top-color: #f60;
                border-radius: 50%;
                animation: spin 0.8s linear infinite;
                z-index: 200;
            }
            @keyframes spin { to { transform: translate(-50%, -50%) rotate(360deg); } }
        </style>
    </head>
    <body>
        <div id="canvas-container">
            <canvas id="canvas"></canvas>
            <div id="tools-container"></div>
            <div id="app-label">SUPERSPLAT LITE</div>
            <div id="cursor-label"></div>
            <div id="drop-overlay"></div>
            <div id="spinner"></div>
        </div>
        <button id="open-file-btn">Open File</button>
        <button id="measure-btn">Measure</button>
        <button id="clear-measure-btn" style="display:none;position:absolute;top:12px;left:248px;background:rgba(30,30,30,0.85);color:#ccc;border:1px solid #555;padding:8px 16px;border-radius:4px;cursor:pointer;font-size:13px;z-index:10;">Clear All</button>
        <script type="module" src="./lite.js"></script>
    </body>
</html>
